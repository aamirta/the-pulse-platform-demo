[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]
exclude = ["venv", ".venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "PIE",  # flake8-pie
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # FastAPI Depends() is intentionally called in default args
  "DTZ003", # datetime.utcnow() is used consistently with SQLAlchemy DateTime columns; migration to timezone-aware requires DB review
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
no_implicit_reexport = false
exclude = ["venv", ".venv", "alembic/versions"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thepulse-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime dependencies for the serverless function in api/index.py.
#
# Vercel's Python builder prefers pyproject.toml over requirements.txt: with no
# `dependencies` here it created the venv and installed nothing, so importing
# backend.main raised ImportError and every request returned 503. Keep this list
# in step with requirements.txt, minus the packages the function never imports
# (the legacy Flask app, and the scrape/import helpers that .vercelignore drops).
dependencies = [
  "fastapi",
  "pydantic",
  "pydantic-settings",
  "python-multipart",
  "SQLAlchemy>=2.0.0",
  "psycopg2-binary",
  "alembic",
  "python-jose[cryptography]",
  "passlib[argon2]",
  "itsdangerous",
  "slowapi",
  "limits",
  "pypdf",
  "reportlab",
  "Pillow",
  "qrcode",
  "python-dotenv",
  "resend",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
branch = true
omit = [
    "backend/scripts/*",
    "backend/migrations/*",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false
precision = 1
