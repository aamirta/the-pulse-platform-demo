{% extends "base.html" %}

{% block title %}Publish Article - The Pulse{% endblock %}

{% block content %}
<style>
    .page-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .page-header {
        text-align: center; padding: 2.5rem 2rem;
        background: linear-gradient(135deg, rgba(67, 97, 238, 0.15) 0%, rgba(0, 212, 170, 0.1) 100%);
        border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--border-color);
    }
    .page-header h1 {
        font-family: var(--font-heading); font-size: 2rem; font-weight: 700;
        background: linear-gradient(135deg, #4361ee, #00d4aa);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        margin-bottom: 0.5rem;
    }
    .page-header p { color: var(--text-secondary); font-size: 1rem; }
    .form-card {
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem;
    }
    .form-section-title {
        font-family: var(--font-heading); font-weight: 600; font-size: 1.1rem;
        color: var(--text-primary); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .form-section-title i { color: #4361ee; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 500; font-size: 0.88rem; color: var(--text-primary); margin-bottom: 0.4rem; }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--border-color); border-radius: 10px;
        background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body);
        font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #4361ee; }
    .form-group textarea { min-height: 150px; resize: vertical; }
    .form-group .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
    .checkbox-group input[type="checkbox"] { width: auto; }
    .checkbox-group label { margin-bottom: 0; }
    .submit-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        width: 100%; padding: 0.9rem;
        background: linear-gradient(135deg, #4361ee, #3a56d4); color: #fff; border: none;
        border-radius: 12px; font-family: var(--font-heading); font-size: 1rem; font-weight: 600;
        cursor: pointer; transition: all 0.2s ease;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(67, 97, 238, 0.3); }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
</style>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-pen-to-square"></i> Publish Article</h1>
        <p>Share news, interviews, or analyses about the ecosystem</p>
    </div>

    <form action="{{ url_for('article_form') }}" method="POST">
        <div class="form-card">
            <div class="form-section-title"><i class="fas fa-newspaper"></i> Article Details</div>
            <div class="form-group">
                <label>Title *</label>
                <input type="text" name="title" required placeholder="Article headline">
            </div>
            <div class="form-group">
                <label>Summary</label>
                <textarea name="summary" rows="3" placeholder="Brief summary (2-3 sentences)..." style="min-height: 80px;"></textarea>
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea name="content" placeholder="Full article content..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select name="category">
                        <option value="">Select category</option>
                        <option value="Actualité">Actualité</option>
                        <option value="Interview">Interview</option>
                        <option value="Analyse">Analyse</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Author</label>
                    <input type="text" name="author" placeholder="Author name">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Source</label>
                    <input type="text" name="source" placeholder="e.g. Medias24, Le Desk, etc.">
                </div>
                <div class="form-group">
                    <label>Source URL</label>
                    <input type="url" name="source_url" placeholder="https://...">
                </div>
            </div>
            <div class="form-group">
                <label>Image URL</label>
                <input type="url" name="image_url" placeholder="https://... (cover image)">
            </div>
            <div class="form-group">
                <label>Tags</label>
                <input type="text" name="tags" placeholder="e.g. Fintech, Levée de fonds, Casablanca">
                <div class="hint">Comma-separated tags</div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" name="is_featured" id="is_featured" value="1">
                <label for="is_featured">Mark as Featured</label>
            </div>
        </div>

        <button type="submit" class="submit-btn">
            <i class="fas fa-paper-plane"></i> Publish
        </button>
    </form>
</div>
{% endblock %}
