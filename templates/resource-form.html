{% extends "base.html" %}

{% block title %}Add Resource - The Pulse{% endblock %}

{% block content %}
<style>
    .page-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .page-header {
        text-align: center; padding: 2.5rem 2rem;
        background: linear-gradient(135deg, rgba(0, 212, 170, 0.15) 0%, rgba(247, 183, 49, 0.1) 100%);
        border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--border-color);
    }
    .page-header h1 {
        font-family: var(--font-heading); font-size: 2rem; font-weight: 700;
        background: linear-gradient(135deg, #00d4aa, #f7b731);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        margin-bottom: 0.5rem;
    }
    .page-header p { color: var(--text-secondary); font-size: 1rem; }
    .form-card {
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem;
    }
    .form-section-title {
        font-family: var(--font-heading); font-weight: 600; font-size: 1.1rem;
        color: var(--text-primary); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .form-section-title i { color: #00d4aa; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 500; font-size: 0.88rem; color: var(--text-primary); margin-bottom: 0.4rem; }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--border-color); border-radius: 10px;
        background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body);
        font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #00d4aa; }
    .form-group textarea { min-height: 120px; resize: vertical; }
    .form-group .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
    .checkbox-group input[type="checkbox"] { width: auto; }
    .checkbox-group label { margin-bottom: 0; }
    .submit-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        width: 100%; padding: 0.9rem;
        background: linear-gradient(135deg, #00d4aa, #00b894); color: #fff; border: none;
        border-radius: 12px; font-family: var(--font-heading); font-size: 1rem; font-weight: 600;
        cursor: pointer; transition: all 0.2s ease;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 212, 170, 0.3); }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
</style>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-book-open"></i> Add Resource</h1>
        <p>Share useful resources for the entrepreneurial ecosystem</p>
    </div>

    <form action="{{ url_for('resource_form') }}" method="POST">
        <div class="form-card">
            <div class="form-section-title"><i class="fas fa-info-circle"></i> Resource Details</div>
            <div class="form-group">
                <label>Title *</label>
                <input type="text" name="title" required placeholder="Resource title">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Brief description of this resource..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select name="category">
                        <option value="">Select category</option>
                        <option value="Politiques publiques">Politiques publiques</option>
                        <option value="Dispositifs d appui">Dispositifs d'appui</option>
                        <option value="Guides pratiques">Guides pratiques</option>
                        <option value="Appels à projets">Appels à projets</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="resource_type">
                        <option value="">Select type</option>
                        <option value="PDF">PDF</option>
                        <option value="Lien">Lien</option>
                        <option value="Guide">Guide</option>
                        <option value="Vidéo">Vidéo</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>URL / Link</label>
                <input type="url" name="url" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Organization</label>
                <input type="text" name="organization" placeholder="e.g. Maroc PME, CRI, ANPME...">
            </div>
            <div class="form-group">
                <label>Tags</label>
                <input type="text" name="tags" placeholder="e.g. Forsa, Intelaka, Fiscalité">
                <div class="hint">Comma-separated tags</div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" name="is_featured" id="is_featured" value="1">
                <label for="is_featured">Mark as Featured</label>
            </div>
        </div>

        <button type="submit" class="submit-btn">
            <i class="fas fa-plus-circle"></i> Add Resource
        </button>
    </form>
</div>
{% endblock %}
