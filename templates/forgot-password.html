{% extends "base.html" %}
{% block title %}Mot de passe oublié - The Pulse{% endblock %}
{% block content %}
<style>
.auth-page { max-width: 440px; margin: 4rem auto; padding: 0 1.5rem; }
.auth-card { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 16px; padding: 2.5rem; }
.auth-title { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.5rem; }
.auth-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 2rem; line-height: 1.6; }
.form-group { margin-bottom: 1.25rem; }
.form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
.form-input { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border-primary); background: var(--bg-surface); color: var(--text-primary); font-size: 0.95rem; box-sizing: border-box; }
.form-input:focus { outline: none; border-color: var(--accent); }
.btn-submit { width: 100%; padding: 0.85rem; border-radius: 10px; background: linear-gradient(135deg, #00d4aa, #4361ee); color: #fff; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; }
.auth-message { background: rgba(0,212,170,0.1); border: 1px solid rgba(0,212,170,0.3); border-radius: 10px; padding: 1rem; color: #00d4aa; font-size: 0.9rem; margin-bottom: 1.5rem; }
.back-link { display: block; text-align: center; margin-top: 1.25rem; color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; }
.back-link:hover { color: var(--accent); }
</style>
<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Mot de passe oublié</h1>
    <p class="auth-subtitle">Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
    {% if message %}
    <div class="auth-message"><i class="fas fa-check-circle"></i> {{ message }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Adresse email</label>
        <input type="email" name="email" class="form-input" placeholder="votre@email.com" required>
      </div>
      <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Envoyer le lien</button>
    </form>
    <a href="/join" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
  </div>
</div>
{% endblock %}
