<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Pulse - Moroccan Startup Ecosystem{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Primary Brand Colors */
            --primary-green: #10B981;
            --dark-green: #059669;
            --light-green: #34D399;
            
            /* Accent Colors */
            --accent-blue: #3B82F6;
            --accent-purple: #8B5CF6;
            --accent-orange: #F59E0B;
            --accent-pink: #EC4899;
            --accent-red: #EF4444;
            --accent-indigo: #6366F1;
            --accent-teal: #14B8A6;
            --accent-cyan: #06B6D4;
            --accent-lime: #84CC16;
            --accent-yellow: #EAB308;
            
            /* Dark Theme (Default) */
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --bg-card-hover: #334155;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dark: #475569;
            --border-color: #334155;
            --border-light: #475569;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --overlay-color: rgba(15, 23, 42, 0.8);
            
            /* Chart Colors for Dark Theme */
            --chart-text-color: #94A3B8;
            --chart-grid-color: rgba(51, 65, 85, 0.5);
            --chart-background: transparent;
            
            /* Gradients */
            --gradient-1: linear-gradient(135deg, #10B981, #34D399);
            --gradient-2: linear-gradient(135deg, #3B82F6, #60A5FA);
            --gradient-3: linear-gradient(135deg, #8B5CF6, #A78BFA);
            --gradient-4: linear-gradient(135deg, #F59E0B, #FBBF24);
            --gradient-red: linear-gradient(135deg, #EF4444, #F87171);
            --gradient-indigo: linear-gradient(135deg, #6366F1, #818CF8);
            --gradient-teal: linear-gradient(135deg, #14B8A6, #2DD4BF);
            --gradient-cyan: linear-gradient(135deg, #06B6D4, #22D3EE);
            
            /* Status Colors */
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --error-color: #EF4444;
            --info-color: #3B82F6;
        }

        /* Light Mode Variables */
        [data-theme="light"] {
            /* Light Theme Backgrounds */
            --bg-dark: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F1F5F9;
            --text-light: #1E293B;
            --text-muted: #64748B;
            --text-dark: #94A3B8;
            --border-color: #E2E8F0;
            --border-light: #CBD5E1;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --overlay-color: rgba(248, 250, 252, 0.8);
            
            /* Chart Colors for Light Theme */
            --chart-text-color: #64748B;
            --chart-grid-color: rgba(226, 232, 240, 0.8);
            --chart-background: #FFFFFF;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 1rem;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .theme-toggle i {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover i {
            transform: rotate(180deg);
        }

        [data-theme="light"] .theme-toggle {
            background: rgba(0, 0, 0, 0.05);
            border-color: var(--border-color);
        }

        [data-theme="light"] .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        [data-theme="light"] body {
            background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
        }

        /* Navbar Styles */
        .navbar-custom {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1050;
            transition: all 0.3s ease;
        }

        [data-theme="light"] .navbar-custom {
            background: rgba(248, 250, 252, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-custom.scrolled {
            background: rgba(15, 23, 42, 0.98);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] .navbar-custom.scrolled {
            background: rgba(248, 250, 252, 0.98);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .hamburger-btn:hover {
            background: var(--primary-green);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--primary-green);
            text-decoration: none;
            margin-left: 1rem;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s ease;
        }

        .logo-text:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .nav-menu-right {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link-custom {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-link-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .nav-link-custom:hover {
            color: var(--primary-green);
            transform: translateY(-2px);
        }

        .nav-link-custom:hover::before {
            left: 100%;
        }

        .btn-get-started {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-get-started::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-get-started:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-get-started:hover::before {
            left: 100%;
        }

        /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-card) 100%);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            z-index: 1060;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        [data-theme="light"] .sidebar {
            background: linear-gradient(180deg, var(--bg-card) 0%, #F1F5F9 100%);
            border-right: 1px solid var(--border-color);
        }

        .sidebar.active {
            left: 0;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.3);
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .sidebar-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .sidebar-menu {
            padding: 1.5rem 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.1));
            transition: right 0.3s ease;
        }

        .menu-item:hover {
            background: rgba(16, 185, 129, 0.1);
            border-left-color: var(--primary-green);
            color: var(--light-green);
            transform: translateX(5px);
        }

        .menu-item:hover::before {
            right: 100%;
        }

        .menu-item i {
            margin-right: 1rem;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1055;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Content Styles */
        .main-content {
            margin-top: 100px;
            padding: 2rem;
            min-height: calc(100vh - 100px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-menu-right {
                gap: 1rem;
            }

            .nav-link-custom {
                display: none;
            }

            .nav-link-custom.mobile-show {
                display: block;
            }

            .logo-text {
                font-size: 1.5rem;
            }
        }

        /* Custom Scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: var(--bg-card);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary-green);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--dark-green);
        }

        /* Animation Classes */
        .fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <!-- Left side - Hamburger and Logo -->
            <div class="d-flex align-items-center">
                <button class="hamburger-btn" id="sidebarToggle" type="button">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="/" class="logo-text">The Pulse</a>
            </div>

            <!-- Right side - Navigation Links -->
            <div class="nav-menu-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="btn btn-get-started" onclick="location.href='/join'">
                    <i class="fas fa-rocket me-2"></i>Join the Pulse
                </button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Dashboard Menu</div>
            <div class="sidebar-subtitle">Moroccan Startup Ecosystem</div>
        </div>
        <div class="sidebar-menu">
            <a href="/" class="menu-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>

            <a href="/startups" class="menu-item">
                <i class="fas fa-rocket"></i>
                <span>Startups</span>
            </a>
            <a href="/founders" class="menu-item">
                <i class="fas fa-users"></i>
                <span>Founders</span>
            </a>
            <a href="/investors" class="menu-item">
                <i class="fas fa-handshake"></i>
                <span>Investors</span>
            </a>
            <a href="/incubators" class="menu-item">
                <i class="fas fa-building"></i>
                <span>Incubators</span>
            </a>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <div class="main-content fade-in">
        {% block content %}
        <!-- Default content - replace this with your Flask template blocks -->
        <div class="container">
            <h1 class="display-4 text-center mb-4">Welcome to The Pulse</h1>
            <p class="lead text-center">Your gateway to the Moroccan startup ecosystem</p>
        </div>
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const navbar = document.querySelector('.navbar-custom');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // Theme Toggle Functionality
            function initTheme() {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateThemeIcon(savedTheme);
            }

            function updateThemeIcon(theme) {
                if (theme === 'light') {
                    themeIcon.classList.remove('fa-moon');
                    themeIcon.classList.add('fa-sun');
                } else {
                    themeIcon.classList.remove('fa-sun');
                    themeIcon.classList.add('fa-moon');
                }
            }

            function toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateThemeIcon(newTheme);
            }

            // Initialize theme on page load
            initTheme();

            // Theme toggle event listener
            themeToggle.addEventListener('click', toggleTheme);

            // Sidebar toggle functionality
            function toggleSidebar() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
                
                // Add animation to hamburger icon
                const icon = sidebarToggle.querySelector('i');
                if (sidebar.classList.contains('active')) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-times');
                } else {
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                }
            }

            // Event listeners
            sidebarToggle.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);

            // Close sidebar when clicking menu items
            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    setTimeout(toggleSidebar, 150);
                });
            });

            // Navbar scroll effect
            let lastScrollTop = 0;
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }

                lastScrollTop = scrollTop;
            });

            // Close sidebar on escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('active')) {
                    toggleSidebar();
                }
            });

            // Add hover effect to navigation links
            const navLinks = document.querySelectorAll('.nav-link-custom');
            navLinks.forEach(link => {
                link.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-2px)';
                });
                
                link.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });

            // Add ripple effect to buttons
            const buttons = document.querySelectorAll('.btn-get-started, .hamburger-btn');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.cssText = `
                        position: absolute;
                        width: ${size}px;
                        height: ${size}px;
                        left: ${x}px;
                        top: ${y}px;
                        background: rgba(255, 255, 255, 0.3);
                        border-radius: 50%;
                        pointer-events: none;
                        transform: scale(0);
                        animation: ripple 0.6s ease-out;
                    `;
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });

            // CSS for ripple animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });
    </script>

    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" 
        integrity="sha512-ElRFoEQdI5Ht6kZvyzXhYG9NqjtkmlkfYk0wr6wHxU9JEHakS7UJZNeml5ALk+8IKlU6jDgMabC3vkumRokgJA==" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer">
</script>

    {% block scripts %}
    <!-- Additional scripts can be added here -->
    {% endblock %}
</body>
</html>
