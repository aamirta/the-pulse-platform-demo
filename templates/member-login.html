{% extends "base.html" %}
{% block title %}Se connecter - The Pulse{% endblock %}
{% block content %}
<style>
    .auth-page { max-width: 440px; margin: 4rem auto; padding: 0 1.5rem; }
    .auth-card {
        background: var(--bg-card);
        border: 1px solid var(--border-primary);
        border-radius: 16px;
        padding: 2.5rem;
    }
    .auth-title {
        font-family: var(--font-heading);
        font-size: 1.7rem;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0 0 0.4rem;
        background: linear-gradient(135deg, #00d4aa, #4361ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .auth-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 2rem; line-height: 1.6; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-input {
        width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
        border: 1px solid var(--border-primary); background: var(--bg-surface);
        color: var(--text-primary); font-size: 0.95rem; box-sizing: border-box;
        transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: #00d4aa; }
    .btn-submit {
        width: 100%; padding: 0.85rem; border-radius: 10px;
        background: linear-gradient(135deg, #00d4aa, #4361ee);
        color: #fff; font-weight: 700; font-size: 1rem; border: none; cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; }
    .auth-error {
        background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
        border-radius: 10px; padding: 1rem; color: #f87171; font-size: 0.875rem; margin-bottom: 1.5rem;
    }
    .auth-links { display: flex; justify-content: space-between; margin-top: 1.25rem; flex-wrap: wrap; gap: 0.5rem; }
    .auth-link { color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; }
    .auth-link:hover { color: #00d4aa; }
    .auth-divider { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 1.5rem 0; position: relative; }
    .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border-primary); }
    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }
    .btn-join-alt {
        display: block; width: 100%; text-align: center; padding: 0.75rem;
        border-radius: 10px; border: 1px solid rgba(0,212,170,0.3);
        color: #00d4aa; font-weight: 600; font-size: 0.9rem; text-decoration: none;
        transition: background 0.2s;
    }
    .btn-join-alt:hover { background: rgba(0,212,170,0.08); }
</style>

<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Se connecter</h1>
        <p class="auth-subtitle">Accédez à votre espace membre sur The Pulse.</p>

        {% if error %}
        <div class="auth-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label class="form-label">Adresse email</label>
                <input type="email" name="email" class="form-input" placeholder="votre@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Se connecter</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('forgot_password') }}" class="auth-link"><i class="fas fa-key"></i> Mot de passe oublié ?</a>
            <a href="/join" class="auth-link"><i class="fas fa-bolt"></i> Pas encore inscrit ?</a>
        </div>

        <div class="auth-divider">ou</div>
        <a href="/join" class="btn-join-alt"><i class="fas fa-bolt"></i> Power the Pulse — S'inscrire</a>
    </div>
</div>
{% endblock %}
