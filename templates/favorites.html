{% extends "base.html" %}

{% block title %}Mes Favoris - The Pulse{% endblock %}

{% block content %}
<style>
    .fav-page-header {
        background: linear-gradient(135deg, rgba(255, 107, 107, 0.08) 0%, var(--secondary-subtle) 100%);
        padding: 3rem 0 2rem 0;
        margin-bottom: 2rem;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border-color);
    }

    .fav-page-title {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 0.5rem;
        color: #ff6b6b;
        position: relative;
        z-index: 2;
    }

    .fav-page-subtitle {
        color: var(--text-secondary);
        font-size: 1.1rem;
        position: relative;
        z-index: 2;
    }

    .fav-section {
        margin-bottom: 2.5rem;
    }

    .fav-section-title {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.3rem;
        color: var(--text-primary);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }

    .fav-section-title i {
        color: var(--accent);
        font-size: 1.1rem;
    }

    .fav-section-title .fav-section-count {
        background: var(--accent-subtle);
        color: var(--accent);
        font-size: 0.8rem;
        padding: 0.15rem 0.6rem;
        border-radius: 20px;
        font-weight: 600;
    }

    .fav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.25rem;
    }

    .fav-item-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 1.25rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        cursor: pointer;
        transition: all var(--transition-base);
        text-decoration: none;
        color: inherit;
        position: relative;
    }

    .fav-item-card:hover {
        transform: translateY(-3px);
        border-color: rgba(0, 212, 170, 0.25);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        background: var(--bg-card-hover);
    }

    .fav-item-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
        font-family: var(--font-heading);
        font-weight: 700;
        color: white;
    }

    .fav-item-icon.startup { background: var(--gradient-accent); }
    .fav-item-icon.investor { background: var(--gradient-secondary); }
    .fav-item-icon.founder { background: var(--gradient-tertiary); }

    .fav-item-info {
        flex: 1;
        min-width: 0;
    }

    .fav-item-name {
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
    }

    .fav-item-type {
        font-size: 0.78rem;
        color: var(--text-secondary);
        text-transform: capitalize;
    }

    .fav-item-remove {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.85rem;
        padding: 0.3rem;
        border-radius: 6px;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .fav-item-remove:hover {
        color: #ff6b6b;
        background: rgba(255, 107, 107, 0.1);
    }

    .fav-item-arrow {
        color: var(--text-muted);
        font-size: 0.8rem;
        flex-shrink: 0;
        transition: all var(--transition-base);
    }

    .fav-item-card:hover .fav-item-arrow {
        color: var(--accent);
        transform: translateX(3px);
    }

    .fav-empty {
        text-align: center;
        padding: 5rem 2rem;
        color: var(--text-secondary);
    }

    .fav-empty i {
        font-size: 4rem;
        color: var(--text-muted);
        margin-bottom: 1rem;
        display: block;
        opacity: 0.4;
    }

    .fav-empty h3 {
        font-family: var(--font-heading);
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .fav-empty p {
        max-width: 400px;
        margin: 0 auto;
    }

    .fav-loading {
        text-align: center;
        padding: 3rem;
        color: var(--text-secondary);
    }

    .fav-clear-all {
        background: var(--gradient-danger);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all var(--transition-base);
    }

    .fav-clear-all:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }
</style>

<!-- Page Header -->
<div class="fav-page-header">
    <div class="container">
        <h1 class="fav-page-title"><i class="fas fa-heart"></i> Mes Favoris</h1>
        <p class="fav-page-subtitle">Retrouvez ici tous les elements que vous avez sauvegardes</p>
    </div>
</div>

<div class="container">
    <div id="favContent">
        <div class="fav-loading">
            <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 0.5rem;"></i>
            <p>Chargement de vos favoris...</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var favs = getFavorites();
    var keys = Object.keys(favs);
    var container = document.getElementById('favContent');

    if (keys.length === 0) {
        container.innerHTML =
            '<div class="fav-empty">' +
                '<i class="far fa-heart"></i>' +
                '<h3>Aucun favori pour le moment</h3>' +
                '<p>Cliquez sur le bouton coeur sur les fiches startups, investisseurs ou fondateurs pour les ajouter ici.</p>' +
            '</div>';
        return;
    }

    // Group by type
    var grouped = { startup: [], investor: [], founder: [] };
    keys.forEach(function(key) {
        var item = favs[key];
        if (grouped[item.type]) {
            grouped[item.type].push(item);
        }
    });

    // Sort each group by timestamp (newest first)
    Object.keys(grouped).forEach(function(type) {
        grouped[type].sort(function(a, b) { return b.timestamp - a.timestamp; });
    });

    var typeConfig = {
        startup: { label: 'Startups', icon: 'fas fa-rocket', url: '/startup/' },
        investor: { label: 'Investisseurs', icon: 'fas fa-hand-holding-usd', url: '/investor/' },
        founder: { label: 'Fondateurs', icon: 'fas fa-users', url: '/founder/' }
    };

    var html = '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem;">' +
        '<span style="color:var(--text-secondary); font-size:0.9rem;">' + keys.length + ' element' + (keys.length > 1 ? 's' : '') + ' sauvegarde' + (keys.length > 1 ? 's' : '') + '</span>' +
        '<button class="fav-clear-all" onclick="clearAllFavorites()"><i class="fas fa-trash-alt"></i> Tout supprimer</button>' +
    '</div>';

    ['startup', 'investor', 'founder'].forEach(function(type) {
        var items = grouped[type];
        if (items.length === 0) return;

        var config = typeConfig[type];
        html += '<div class="fav-section">';
        html += '<h2 class="fav-section-title"><i class="' + config.icon + '"></i> ' + config.label +
            ' <span class="fav-section-count">' + items.length + '</span></h2>';
        html += '<div class="fav-grid">';

        items.forEach(function(item) {
            var key = item.type + '_' + item.id;
            html += '<div class="fav-item-card" onclick="window.location.href=\'' + config.url + item.id + '\'">' +
                '<div class="fav-item-icon ' + type + '"><i class="' + config.icon + '"></i></div>' +
                '<div class="fav-item-info">' +
                    '<h4 class="fav-item-name" id="fav-name-' + key + '">Chargement...</h4>' +
                    '<div class="fav-item-type">' + config.label.slice(0, -1) + '</div>' +
                '</div>' +
                '<button class="fav-item-remove" onclick="event.stopPropagation(); removeFavorite(\'' + key + '\', this);" title="Retirer des favoris">' +
                    '<i class="fas fa-times"></i>' +
                '</button>' +
                '<i class="fas fa-chevron-right fav-item-arrow"></i>' +
            '</div>';
        });

        html += '</div></div>';
    });

    container.innerHTML = html;

    // Fetch names via the search API
    keys.forEach(function(key) {
        var item = favs[key];
        var searchQuery = item.type + ':' + item.id;
        fetch('/api/search?q=' + encodeURIComponent(item.id))
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var nameEl = document.getElementById('fav-name-' + key);
                if (!nameEl) return;

                var found = false;
                if (data.results) {
                    data.results.forEach(function(result) {
                        if (found) return;
                        var resultId = String(result.id || '');
                        var itemId = String(item.id);
                        if (resultId === itemId && result.type === item.type) {
                            nameEl.textContent = result.name || result.title || ('ID: ' + item.id);
                            found = true;
                        }
                    });
                }
                if (!found) {
                    nameEl.textContent = item.type.charAt(0).toUpperCase() + item.type.slice(1) + ' #' + item.id;
                }
            })
            .catch(function() {
                var nameEl = document.getElementById('fav-name-' + key);
                if (nameEl) {
                    nameEl.textContent = item.type.charAt(0).toUpperCase() + item.type.slice(1) + ' #' + item.id;
                }
            });
    });
});

function removeFavorite(key, btn) {
    var favs = getFavorites();
    delete favs[key];
    localStorage.setItem('pulse_favorites', JSON.stringify(favs));
    updateFavoriteCount();

    // Remove the card from the DOM
    var card = btn.closest('.fav-item-card');
    if (card) {
        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.95)';
        setTimeout(function() {
            card.remove();

            // Check if any section is now empty
            document.querySelectorAll('.fav-section').forEach(function(section) {
                if (section.querySelectorAll('.fav-item-card').length === 0) {
                    section.remove();
                }
            });

            // Check if all favorites are gone
            if (Object.keys(getFavorites()).length === 0) {
                document.getElementById('favContent').innerHTML =
                    '<div class="fav-empty">' +
                        '<i class="far fa-heart"></i>' +
                        '<h3>Aucun favori pour le moment</h3>' +
                        '<p>Cliquez sur le bouton coeur sur les fiches startups, investisseurs ou fondateurs pour les ajouter ici.</p>' +
                    '</div>';
            }
        }, 300);
    }
}

function clearAllFavorites() {
    if (!confirm('Supprimer tous vos favoris ?')) return;
    localStorage.removeItem('pulse_favorites');
    updateFavoriteCount();
    document.getElementById('favContent').innerHTML =
        '<div class="fav-empty">' +
            '<i class="far fa-heart"></i>' +
            '<h3>Aucun favori pour le moment</h3>' +
            '<p>Cliquez sur le bouton coeur sur les fiches startups, investisseurs ou fondateurs pour les ajouter ici.</p>' +
        '</div>';
}
</script>
{% endblock %}
